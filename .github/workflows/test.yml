name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        gemfile:
          - Gemfile-rails7.1
          - Gemfile-rails7.2
          - Gemfile-rails8.0
          - Gemfile-rails8.1

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up database
        run: bin/rails db:setup

      - name: RSpec
        run: bin/rspec --format RSpec::Github::Formatter --format progress
